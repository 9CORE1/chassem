    <script>
        function showToast(message) {
            const toast = document.getElementById('share-toast');
            if (!toast) return;
            const toastText = toast.querySelector('span');
            if (toastText && message) {
                toastText.textContent = message;
            }
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function copyEmail(event) {
            if (event) {
                event.preventDefault();
            }
            const email = 'jjung9935@naver.com';

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(email)
                    .then(() => {
                        showToast(`이메일 주소(${email})가 복사되었습니다!`);
                    })
                    .catch(() => {
                        fallbackCopyText(email, `이메일 주소(${email})가 복사되었습니다!`);
                    });
            } else {
                fallbackCopyText(email, `이메일 주소(${email})가 복사되었습니다!`);
            }
        }

        function fallbackCopyText(text, successMessage) {
            const dummy = document.createElement('textarea');
            dummy.value = text;
            dummy.style.position = 'fixed';
            dummy.style.left = '-9999px';
            dummy.style.top = '0';
            document.body.appendChild(dummy);
            dummy.focus();
            dummy.select();
            
            try {
                document.execCommand('copy');
                showToast(successMessage || '복사되었습니다!');
            } catch (err) {
                console.error('텍스트 복사 실패:', err);
                prompt('아래 이메일 주소를 복사해 주세요:', text);
            } finally {
                document.body.removeChild(dummy);
            }
        }

        function copyLinkTreeUrl() {
            const text = window.location.href;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text)
                    .then(() => {
                        showToast('링크가 클립보드에 복사되었습니다!');
                    })
                    .catch(() => {
                        fallbackCopyText(text, '링크가 클립보드에 복사되었습니다!');
                    });
            } else {
                fallbackCopyText(text, '링크가 클립보드에 복사되었습니다!');
            }
        }

        function handleHomeClick(event) {
            if (window.self !== window.top) {
                event.preventDefault();
                window.parent.postMessage('close-linktree-modal', '*');
            }
        }
    </script>
</body>
</html>
